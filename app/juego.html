<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brotato · VoxPix</title>
  <!-- El favicon del juego (scripts/favicon.ts), relativo: vale también servido bajo /juego/ -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    /* touch-action: arrastrar el joystick no desplaza ni amplía la página */
    html, body { margin: 0; height: 100%; background: #0d0c12; color: #d9d7e8; font: 14px system-ui, sans-serif; overflow: hidden; touch-action: none; }
    canvas { image-rendering: pixelated; display: block; margin: 0 auto; }
    /* La interfaz se pinta en #ui con la fuente de píxel; #hud repite su texto para lectores de pantalla */
    #ui { position: fixed; margin: 0; touch-action: none; }
    /* Los efectos de la oleada (números, avisos, muertes), entre el mundo y la interfaz */
    #fx { position: fixed; margin: 0; pointer-events: none; }
    #hud { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    #lowdetail { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); padding: 6px 12px; display: none;
      background: #1a1420e6; color: #ffd08a; border: 1px solid #6a4a2a; border-radius: 4px; font-size: 13px; pointer-events: none; }
    /* El commit de la build, abajo a la izquierda y solo en la portada */
    #version { position: fixed; left: 6px; bottom: 4px; font: 11px monospace; color: #8a86a0; opacity: .7; pointer-events: none; z-index: 5; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(13,12,18,.82); font-size: 16px; transition: background-color .3s; }
    /* El letrero de piso sobre la caída: sin velo, para que se vea caer el piso (main.ts, enterSign/leaveSign) */
    #loading.claro { background-color: transparent; }
    /* Entra cayendo a saltos y se balancea mientras está; sale subiendo. Solo transform y opacity: siguen moviéndose
       aunque el horneado bloquee el hilo principal */
    #loading canvas.entra { animation: sign-in .28s steps(4) both, sign-bob 1s steps(2) .28s infinite; }
    #loading canvas.sale { animation: sign-out .24s steps(3) both; }
    @keyframes sign-in { from { transform: translateY(-24px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes sign-bob { from { transform: none; } to { transform: translateY(-4px); } }
    @keyframes sign-out { from { transform: none; opacity: 1; } to { transform: translateY(-24px); opacity: 0; } }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <canvas id="fx"></canvas>
  <canvas id="ui"></canvas>
  <div id="hud" role="status"></div>
  <div id="lowdetail"></div>
  <div id="version"></div>
  <div id="loading">Construyendo el mundo en vóxeles…</div>
  <script type="module" src="./src/juego/main.ts"></script>
</body>
</html>
